name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, validate, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roll_shushi?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Export generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit dependency tree (report only)
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); const v=a.vulnerabilities||{}; for (const [name,x] of Object.entries(v)) console.log(name + ' | ' + x.severity + ' | direct=' + x.isDirect + ' | fix=' + JSON.stringify(x.fixAvailable)); console.log('Totals:', JSON.stringify(a.metadata?.vulnerabilities || {}));"

      - name: Export npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace @vot-eto-roll/api

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @vot-eto-roll/api

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build
